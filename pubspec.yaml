name: to_do
description: A clean Material 3 To‑Do app with RTL/LTR, onboarding (name + gallery avatar), and Hive storage.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # (اختياريين لو محتاجهم لاحقًا)
  flutter_riverpod: ^2.3.10
  shared_preferences: ^2.2.2

  intl: ^0.20.2

  # التخزين ووسائط الجهاز
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_picker: ^1.1.2
  path_provider: ^2.1.3
  table_calendar: ^3.0.9

  cupertino_icons: ^1.0.6
  salomon_bottom_bar: ^3.3.2
  flutter_local_notifications: 17.2.4
  timezone: 0.9.4
flutter_timezone: any
timezone: ^0.9.2
flutter_native_timezone: any


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.9
  hive_generator: ^2.0.1   # ← هنا مكانها الصحيح تحت dev_dependencies

flutter:
  uses-material-design: true
